services:
  php:
    build: .
    container_name: noctis-php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=chards
      - DB_USER=nf_user
      - DB_PASS=nf_pass

  db:
    image: mysql:8.0
    container_name: noctis-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: chards
      MYSQL_USER: nf_user
      MYSQL_PASSWORD: nf_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin
    container_name: noctis-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: nf_user
      PMA_PASSWORD: nf_pass
    depends_on:
      - db

volumes:
  db_data: